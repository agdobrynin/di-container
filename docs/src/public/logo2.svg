<svg viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg">
 <!-- Background -->
 <g class="layer">
  <title>Layer 1</title>
  <rect fill="none" height="798" id="svg_1" width="798" x="2" y="0"/>
  <g id="svg_2" transform="matrix(1 0 0 1 0 0)">
   <!-- GLOW EFFECT (Center) -->
   <circle cx="402" cy="307.74" fill="url(#centerGlow)" id="svg_3" opacity="0.8" r="153"/>
   <!-- DEFINITIONS -->
   <defs transform="translate(16 0) translate(400 410) translate(560 620) scale(1.39375 1.39375) translate(-560 -620) translate(81.7937 31.7937) scale(1.13677 1.13677) translate(-81.7937 -31.7937) translate(71.9527 441.018) scale(1.05523 1.05523) translate(-71.9527 -441.018) translate(68.1869 417.936) scale(1.01682 1.01682) translate(-68.1869 -417.936)">
    <!-- Radial glow for the center -->
    <radialGradient cx="50%" cy="50%" id="centerGlow" r="50%">
     <stop offset="0%" stop-color="#00F0FF"/>
     <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.5"/>
     <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>
    <!-- Flat Color Palettes (Isometric perspective simulation via flat shades) -->
    <!-- Left Faces (Darker Blue) -->
    <!-- Right Faces (Medium Blue/Turquoise) -->
    <!-- Top Faces (Bright Turquoise/Cyan) -->
   </defs>
   <!-- ISOMETRIC PUZZLE CUBE PIECES -->
   <!-- Base Vector Math for Iso: 
         Top Face projection: (x, y) -> (x - y) * cos(30), (x + y) * sin(30)
         We build cleanly aligned flat paths with subtle spacing gap (4px) to emphasize puzzle structure.
    -->
   <!-- PIECE 1: LEFT BOTTOM PART -->
   <!-- Left Face -->
   <path d="m130,409.74l170,85l0,204l-170,-85l0,-204z" fill="#0A4D8C" id="svg_4"/>
   <path d="m300,494.74l85,-42.5l0,93.5l-85,42.5l0,-93.5z" fill="#06396A" id="svg_5"/>
   <!-- Top projection of left piece -->
   <path d="m130,409.74l85,-42.5l170,85l-85,42.5l-170,-85z" fill="#00A8CC" id="svg_6"/>
   <!-- PIECE 2: RIGHT BOTTOM PART (Fitting In) -->
   <!-- Right Face -->
   <path d="m504,494.74l170,-85l0,204l-170,85l0,-204z" fill="#008BB0" id="svg_7"/>
   <path d="m419,452.24l85,42.5l0,93.5l-85,-42.5l0,-93.5z" fill="#00A8CC" id="svg_8"/>
   <!-- Top projection of right piece -->
   <path d="m419,452.24l170,-85l85,42.5l-170,85l-85,-42.5z" fill="#00E5FF" id="svg_9"/>
   <!-- PIECE 3: TOP BACK PIECE (Hovering/Fitting down) -->
   <g id="svg_10" transform="translate(0 -60)">
    <!-- Left Face -->
    <path d="m215,163.24l170,85l0,136l-170,-85l0,-136z" fill="#0D599E" id="svg_11"/>
    <!-- Right Face -->
    <path d="m385,248.24l170,-85l0,136l-170,85l0,-136z" fill="#00BAD6" id="svg_12"/>
    <!-- Top Face -->
    <path d="m215,163.24l187,-93.5l153,93.5l-170,85l-170,-85z" fill="#33F4FF" id="svg_13"/>
   </g>
   <!-- PIECE 4: FOREGROUND SEPARATE FLOATING PUZZLE ELEMENT (Showing Assembly) -->
   <g id="svg_14" transform="translate(0 40)">
    <!-- Left-facing inner cuts -->
    <path d="m317,171.74l85,42.5l0,102l-85,-42.5l0,-102z" fill="#084278" id="svg_15"/>
    <!-- Right-facing inner cuts -->
    <path d="m402,214.24l85,-42.5l0,102l-85,42.5l0,-102z" fill="#0096B8" id="svg_16"/>
    <!-- Top Face -->
    <path d="m317,171.74l85,-42.5l85,42.5l-85,42.5l-85,-42.5z" fill="#00F0FF" id="svg_17"/>
   </g>
   <!-- GLOWING CORE DETAILS (Inner Tech Lines) -->
   <g id="svg_18" opacity="0.9">
    <line id="svg_19" stroke="#00F0FF" stroke-linecap="round" stroke-width="3" x1="385" x2="385" y1="350.24" y2="443.74"/>
    <line id="svg_20" stroke="#00F0FF" stroke-linecap="round" stroke-width="3" x1="419" x2="419" y1="350.24" y2="443.74"/>
    <line id="svg_21" stroke="#33F4FF" stroke-width="2" x1="317" x2="385" y1="299.24" y2="333.24"/>
    <line id="svg_22" stroke="#33F4FF" stroke-width="2" x1="487" x2="419" y1="299.24" y2="333.24"/>
   </g>
  </g>
 </g>
</svg>